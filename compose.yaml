services:
  unminmon:
    build:
      context: .
    container_name: unminmon
    restart: unless-stopped
    init: true
    network_mode: bridge
    dns:
      - ${DOCKER_DNS_1:-1.1.1.1}
      - ${DOCKER_DNS_2:-8.8.8.8}
    env_file:
      - .env
    environment:
      PORT: 5000
    ports:
      - "${HOST_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
